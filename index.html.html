<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digital Products Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: full-bleed dark hero with drifting glow orbs and floating glass chips, then a glass toolbar (search + category chips) and a card grid with pointer-follow glow. Admin is a glass dashboard behind #admin. Single deliberate dark look. */
:root{
  --bg:#05080F; --bg2:#0A1222; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --line:rgba(160,190,255,.16); --ink:#EAF2FF; --muted:#93A4C0;
  --accent:#3CF2D0; --accent2:#7AA2FF; --on-accent:#03140F; --glow:rgba(60,242,208,.35);
  --danger:#FF8585; --danger-soft:rgba(255,133,133,.12); --star:#FFC857; --focus:#3CF2D0;
  --f-display:'Sora','Segoe UI',Tahoma,sans-serif;
  --f-body:'Manrope','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ltr{unicode-bidi:isolate;white-space:nowrap}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(40px,-30px,0) scale(1.12)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-16px) rotate(var(--r,0deg))}}
@keyframes pulse{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes sheen{to{transform:translateX(220%)}}
@keyframes shimmer{to{background-position:-200% 0}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}

/* header */
.top{position:relative;z-index:3}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-decoration:none}
.brand-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 24px var(--glow)}
.pill-link{font-size:.88rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;background:var(--glass);cursor:pointer;transition:.25s}
.pill-link:hover{color:var(--ink);border-color:var(--accent);box-shadow:0 0 18px var(--glow)}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;margin-top:-72px;padding-top:72px;background:radial-gradient(1200px 500px at 70% -10%,#10264a 0,transparent 60%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);opacity:.5}
.orb{position:absolute;border-radius:50%;filter:blur(70px);z-index:-1;animation:drift 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:rgba(60,242,208,.28);top:40px;left:-80px}
.orb.b{width:380px;height:380px;background:rgba(122,162,255,.26);top:-60px;right:-60px;animation-delay:-5s}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:56px 72px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--accent);border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 14px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;margin-top:18px;letter-spacing:-.02em}
.grad{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin:18px 0 0;color:var(--muted);max-width:48ch;font-size:1.05rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stage{position:relative;height:340px}
.chip3d{position:absolute;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;color:var(--accent);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 30px var(--glow);animation:floaty 7s ease-in-out infinite}
.chip3d svg{width:42%;height:42%}
.c1{width:150px;height:150px;left:6%;top:12%;--r:-8deg}
.c2{width:120px;height:120px;right:8%;top:2%;--r:7deg;animation-delay:-2s;color:var(--accent2)}
.c3{width:130px;height:130px;right:22%;bottom:2%;--r:-4deg;animation-delay:-4s}
.steps{list-style:none;margin:0;padding:0 0 56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass);font-size:.93rem;color:var(--muted)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--on-accent);background:var(--accent);box-shadow:0 0 14px var(--glow)}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:12px;padding:11px 20px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),#7CF7E0);box-shadow:0 8px 28px -8px var(--glow);transition:transform .25s,box-shadow .25s}
.btn::after{content:"";position:absolute;inset:0 auto 0 -60%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(0) skewX(-20deg)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -8px var(--glow)}
.btn:hover::after{animation:sheen .9s ease}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{color:var(--ink);background:var(--glass);border-color:var(--line);box-shadow:none}
.btn.ghost::after{display:none}
.btn.ghost:hover{border-color:var(--accent);box-shadow:0 0 20px var(--glow)}
.btn.danger{color:var(--danger);background:transparent;border-color:var(--danger);box-shadow:none}
.btn.danger::after{display:none}
.btn.danger.armed{background:var(--danger);color:#1a0505}
.btn.sm{padding:7px 13px;font-size:.82rem;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

/* toolbar */
.toolbar{display:grid;gap:14px;padding-block:8px 6px}
.search{position:relative}
.search input{width:100%;padding:15px 18px 15px 50px;border:1px solid var(--line);border-radius:14px;background:var(--glass);font-size:1rem;transition:.25s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(60,242,208,.14),0 0 26px var(--glow)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--muted);transition:.2s}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
.count{color:var(--muted);font-size:.88rem;margin:6px 0 16px;min-height:1.4em}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;padding-bottom:72px}
.card{--mx:50%;--my:0%;position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--glass2),var(--glass));overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .35s}
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(60,242,208,.16),transparent 65%)}
.card:hover{transform:translateY(-6px);border-color:rgba(60,242,208,.55);box-shadow:0 24px 60px -20px rgba(0,0,0,.7),0 0 36px -6px var(--glow)}
.card:hover::before{opacity:1}
.cover{position:relative;aspect-ratio:16/11;overflow:hidden;background:var(--bg2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .cover img{transform:scale(1.06)}
.cover.gen{background:
  radial-gradient(circle at 25% 15%,hsl(var(--h) 95% 58% / .6),transparent 55%),
  radial-gradient(circle at 85% 95%,hsl(calc(var(--h) + 70) 95% 55% / .5),transparent 55%),#0A1224}
.cover.gen::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
.glyph{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:24px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 40px hsl(var(--h) 95% 60% / .6);animation:floaty 6s ease-in-out infinite}
.glyph svg{width:42px;height:42px;filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
.glyph::after{content:"";position:absolute;inset:0;border-radius:24px;border:1px solid rgba(255,255,255,.45);animation:pulse 3s ease-out infinite}
.cover.sm{width:56px;height:56px;aspect-ratio:auto;border-radius:12px;flex:none}
.cover.sm .glyph{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:10px;animation:none;box-shadow:none}
.cover.sm .glyph svg{width:18px;height:18px}.cover.sm .glyph::after{display:none}
.cover.sm::before{display:none}
.badge{position:absolute;left:12px;top:12px;z-index:1;font-size:.74rem;font-weight:700;letter-spacing:.03em;color:#fff;background:rgba(5,8,15,.6);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card-body{position:relative;z-index:3;display:flex;flex-direction:column;gap:10px;padding:18px;flex:1;min-width:0}
.card h3{font-size:1.1rem;font-weight:700;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rate{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.stars{position:relative;display:inline-block;direction:ltr;letter-spacing:2px;line-height:1;font-size:1rem}
.stars-bg{color:rgba(255,255,255,.16)}
.stars-fg{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:var(--star);text-shadow:0 0 10px rgba(255,200,87,.5)}
.card .btn{margin-top:auto;width:100%}
.skeleton{height:380px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(90deg,var(--glass),var(--glass2),var(--glass));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:20px}

/* product illustrations (animated covers) */
.cover{--cq:2.6px}
.art{position:absolute;inset:0;overflow:hidden}
.art-chip{position:absolute;right:calc(3 * var(--cq));bottom:calc(3 * var(--cq));z-index:2;font:700 calc(3.4 * var(--cq)) var(--f-display);color:#fff;background:rgba(5,8,15,.62);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:calc(1.1 * var(--cq)) calc(3 * var(--cq));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@keyframes tilep{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}
@keyframes slide{to{transform:translateX(-50%)}}
@keyframes glowp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
@keyframes scan{from{left:0}to{left:100%}}
@keyframes scanx{from{transform:translateX(0)}to{transform:translateX(calc(86 * var(--cq)))}}
@keyframes tearL{0%,22%{transform:none}48%,68%{transform:translateX(calc(-13 * var(--cq))) rotate(-9deg)}94%,100%{transform:none}}
@keyframes tearR{0%,22%{transform:none}48%,68%{transform:translateX(calc(13 * var(--cq))) rotate(8deg)}94%,100%{transform:none}}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes fillbar{0%{width:6%}70%,100%{width:100%}}
@keyframes pulsef{0%,100%{opacity:.3}50%{opacity:.95}}
@keyframes typing{0%{width:0}55%,100%{width:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes flyin{0%{transform:translateX(0);opacity:0}10%{opacity:1}88%{opacity:1}100%{transform:translateX(calc(-96 * var(--cq)));opacity:0}}
@keyframes ripple{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(560%) skewX(-18deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes bit{0%,24%{opacity:0;transform:translate(0,0) rotate(0)}34%{opacity:1}62%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0}}
@keyframes sheet{0%,20%{opacity:1}24%,92%{opacity:0}96%,100%{opacity:1}}
@keyframes lineIn{0%,52%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}

/* file / folder bundles */
.a-grid{position:absolute;left:calc(6 * var(--cq));right:calc(6 * var(--cq));top:calc(16 * var(--cq));bottom:calc(10 * var(--cq));display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:calc(1.6 * var(--cq))}
.ft{position:relative;display:grid;place-items:center;border-radius:calc(1.4 * var(--cq));background:rgba(255,255,255,.1);border:1px solid hsl(var(--t) 90% 66% / .75);color:hsl(var(--t) 95% 74%);box-shadow:0 0 calc(1.6 * var(--cq)) hsl(var(--t) 90% 60% / .35);animation:tilep 2.8s ease-in-out infinite;animation-delay:var(--d)}
.ft::before{content:"";position:absolute;left:0;right:0;top:0;height:22%;background:hsl(var(--t) 90% 60% / .55);border-radius:calc(1.3 * var(--cq)) calc(1.3 * var(--cq)) 0 0}
.ft svg{width:58%;height:58%;margin-top:12%}
.ft.fd::before{left:0;right:auto;width:44%;top:-12%;height:18%;border-radius:calc(1 * var(--cq)) calc(1 * var(--cq)) 0 0}
.ft.fd{background:hsl(var(--t) 70% 50% / .22)}
.a-sweep{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.a-sweep::after{content:"";position:absolute;top:0;bottom:0;width:14%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 4.2s linear infinite}

/* canva-style template mockups */
.a-slide{position:absolute;inset:calc(13 * var(--cq)) 0 calc(5 * var(--cq));display:flex;align-items:center;overflow:hidden}
.a-track{display:flex;align-items:center;gap:calc(5 * var(--cq));width:max-content;padding-left:calc(2 * var(--cq));padding-right:calc(5 * var(--cq));animation:slide 20s linear infinite}
.tc{position:relative;flex:none;border-radius:calc(2 * var(--cq));box-shadow:0 calc(1.5 * var(--cq)) calc(4 * var(--cq)) rgba(0,0,0,.45);display:flex;flex-direction:column;gap:calc(1.3 * var(--cq));padding:calc(2.2 * var(--cq))}
.tc .l{display:block;height:calc(1.3 * var(--cq));border-radius:calc(1 * var(--cq));background:rgba(255,255,255,.78)}
.tc .l.s{width:60%;opacity:.65}.tc .l.h{height:calc(2.4 * var(--cq))}
.tc .cir{display:block;width:calc(6 * var(--cq));height:calc(6 * var(--cq));border-radius:50%;background:rgba(255,255,255,.92);flex:none}
.tc .pill{display:block;width:46%;height:calc(3 * var(--cq));border-radius:calc(2 * var(--cq));background:#fff}
.t-post{background:#fdfdff}
.t-post .l{background:#cfd4e2}
.t-post .pic{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:calc(1.2 * var(--cq));background:linear-gradient(145deg,var(--a),var(--b))}
.t-post .pic em{position:absolute;right:18%;top:16%;width:20%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.92)}
.t-post .pic::after{content:"";position:absolute;left:-8%;right:-8%;bottom:0;height:46%;background:rgba(0,0,0,.3);clip-path:polygon(0 100%,24% 28%,44% 68%,70% 12%,100% 100%)}
.t-post .pill{background:var(--b)}
.t-story{background:linear-gradient(170deg,var(--a),var(--b))}
.t-story .cir{margin-bottom:auto}
.t-story .pill{align-self:center;width:60%}
.t-poster{background:linear-gradient(160deg,var(--a),var(--b));overflow:hidden}
.t-poster .big{font:800 calc(8.5 * var(--cq))/1 var(--f-display);color:#fff;margin-bottom:auto}
.t-poster .cir{position:absolute;right:calc(-5 * var(--cq));bottom:calc(-5 * var(--cq));width:calc(17 * var(--cq));height:calc(17 * var(--cq));background:rgba(255,255,255,.18)}
.t-wide{background:linear-gradient(120deg,var(--a),var(--b));flex-direction:row;align-items:center;justify-content:space-between;overflow:hidden}
.t-wide .col{display:flex;flex-direction:column;gap:calc(1.4 * var(--cq));flex:1}
.t-wide .big2{width:calc(15 * var(--cq));height:calc(15 * var(--cq));box-shadow:0 0 0 calc(1.4 * var(--cq)) rgba(255,255,255,.35)}
.t-wide .l{background:#3a2a05}.t-wide .pill{background:#3a2a05;width:55%}
.t-logo{background:#fdfdff;align-items:center;justify-content:center}
.t-logo .mono{width:calc(11 * var(--cq));height:calc(11 * var(--cq));border-radius:50%;display:grid;place-items:center;font:800 calc(6 * var(--cq)) var(--f-display);color:#fff;background:linear-gradient(145deg,var(--a),var(--b))}
.t-logo .l{width:60%;background:#cfd4e2}
.sel::after{content:"";position:absolute;inset:calc(-1 * var(--cq));border:calc(.4 * var(--cq)) dashed #4cc9ff;border-radius:calc(2.4 * var(--cq));animation:blink 1.8s ease-in-out infinite;pointer-events:none}
.hd{position:absolute;width:calc(1.8 * var(--cq));height:calc(1.8 * var(--cq));background:#fff;border:calc(.4 * var(--cq)) solid #4cc9ff;border-radius:50%;z-index:2}
.hd.h1{left:calc(-1.9 * var(--cq));top:calc(-1.9 * var(--cq))}.hd.h2{right:calc(-1.9 * var(--cq));top:calc(-1.9 * var(--cq))}.hd.h3{left:calc(-1.9 * var(--cq));bottom:calc(-1.9 * var(--cq))}.hd.h4{right:calc(-1.9 * var(--cq));bottom:calc(-1.9 * var(--cq))}
.cur{position:absolute;right:calc(-3 * var(--cq));bottom:calc(-4 * var(--cq));width:calc(6 * var(--cq));height:calc(6 * var(--cq));z-index:3;filter:drop-shadow(0 calc(.6 * var(--cq)) calc(1 * var(--cq)) rgba(0,0,0,.5));animation:floaty 3s ease-in-out infinite}
.cur svg{width:100%;height:100%}

/* etsy ideas */
.ring{position:absolute;left:50%;top:50%;border:1px dashed rgba(255,255,255,.32);border-radius:50%;animation:spin 26s linear infinite}
.ring.r1{width:calc(46 * var(--cq));height:calc(46 * var(--cq));margin:calc(-24 * var(--cq)) 0 0 calc(-23 * var(--cq))}

function hex(b){return Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
async function derive(pw){
  var enc=new TextEncoder();
  var key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(PW_SALT),iterations:PW_ITER,hash:'SHA-256'},key,256);
  return hex(new Uint8Array(bits));
}
function buildLogin(){
  $('#view').innerHTML='<div class="wrap"><form class="login rise" id="loginForm" autocomplete="off"><h1 style="font-size:1.6rem">Admin login</h1><p class="hint" style="margin:0">Enter the admin password to open the dashboard.</p><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="off" required></div><p class="msg'+(S.notice?'':' err')+'" id="loginMsg" role="alert">'+esc(S.notice)+'</p><button class="btn" type="submit" id="loginBtn">Sign in</button><a href="#" data-act="home" class="hint">Back to the store</a></form></div>';
  S.notice=''; $('#pw').focus();
}
async function doLogin(){
  var msg=$('#loginMsg'), btn=$('#loginBtn'), pw=$('#pw').value;
  msg.className='msg err';
  var now=Date.now();
  if(now<S.lockUntil){ msg.textContent='Too many attempts. Wait '+Math.ceil((S.lockUntil-now)/1000)+' seconds and try again.'; return; }
  if(!(window.crypto&&crypto.subtle)){ msg.textContent='This browser cannot verify the password securely. Use an up-to-date browser.'; return; }
  btn.disabled=true; msg.textContent='';
  var ok=false; try{ ok=(await derive(pw))===PW_HASH; }catch(e){ msg.textContent='Could not verify the password. Try again.'; btn.disabled=false; return; }
  btn.disabled=false;
  if(ok){ S.unlocked=true; S.fails=0; touch(); showView(); return; }
  S.fails++; $('#pw').value='';
  if(S.fails>=5){ S.lockUntil=Date.now()+60000; S.fails=0; msg.textContent='Wrong password. Sign-in is paused for 60 seconds.'; }
  else msg.textContent='Wrong password.';
  $('#pw').focus();
}

/* ---------- admin: dashboard ---------- */
function buildAdmin(){
  $('#view').innerHTML='<div class="wrap admin"><div class="admin-head"><h1 style="font-size:1.8rem">Dashboard</h1><div class="admin-actions"><a class="btn ghost sm" href="#" data-act="home">View store</a><button class="btn ghost sm" type="button" data-act="logout">Sign out</button></div></div>'+
  '<p class="msg" id="adminMsg" role="status"></p><div class="admin-grid"><section class="panel"><div class="panel-head"><h2 id="listTitle"></h2><button class="btn sm" type="button" data-act="new">Add product</button></div><ul class="plist" id="plist"></ul></section><form class="panel" id="pform" novalidate></form></div></div>';
  adminList(); adminForm();
}
function adminMsg(t,err){ var m=$('#adminMsg'); if(!m) return; m.textContent=t||''; m.className='msg'+(err?' err':''); }
function adminList(){
  var ul=$('#plist'); if(!ul) return;
  $('#listTitle').textContent='Products ('+S.products.length+')';
  ul.innerHTML=S.products.length?S.products.map(function(p){
    var arm=S.delId===p.id;
    return '<li class="pitem">'+cover(p,true)+'<div class="info"><b>'+esc(p.title)+'</b><span>'+esc(p.category)+'</span></div><div class="acts"><button class="btn ghost sm" type="button" data-act="edit" data-id="'+esc(p.id)+'">Edit</button><button class="btn danger sm'+(arm?' armed':'')+'" type="button" data-act="del" data-id="'+esc(p.id)+'">'+(arm?'Confirm delete':'Delete')+'</button></div></li>';
  }).join(''):'<li class="empty">No products yet. Add the first one with the form.</li>';
}
function adminForm(){
  var p=S.products.filter(function(x){return x.id===S.editId})[0]||null;
  S.image=p?cleanImg(p.image):'';
  var cats=[]; S.products.forEach(function(x){ if(x.category&&cats.indexOf(x.category)<0) cats.push(x.category); });
  var url=(S.image&&S.image.indexOf('data:')!==0)?S.image:'';
  $('#pform').innerHTML='<div class="panel-head"><h2>'+(p?'Edit product':'New product')+'</h2></div>'+
  '<div class="field"><label for="f-title">Title</label><input id="f-title" maxlength="140" value="'+esc(p?p.title:'')+'" required></div>'+
  '<div class="field"><label for="f-desc">Description</label><textarea id="f-desc" maxlength="500">'+esc(p?p.desc:'')+'</textarea></div>'+
  '<div class="row2"><div class="field"><label for="f-cat">Category</label><input id="f-cat" maxlength="30" list="catlist" value="'+esc(p?p.category:'')+'" required><datalist id="catlist">'+cats.map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div><div class="field"><label for="f-rating">Rating (0 to 5)</label><input id="f-rating" type="number" min="0" max="5" step="0.1" inputmode="decimal" value="'+(p&&p.rating?p.rating:'')+'"></div></div>'+
  '<span class="hint" style="margin-top:-6px">Leave the rating empty until you have real reviews.</span>'+
  '<div class="field"><label for="f-file">Product image</label><div class="preview"><div id="prev"></div><input id="f-file" type="file" accept="image/png,image/jpeg,image/webp"></div><span class="hint">Upload an image from your device (resized automatically). Without one, an animated cover is shown.</span></div>'+
  '<div class="field"><label for="f-url">Or image URL (https)</label><input id="f-url" type="url" dir="ltr" placeholder="https://" value="'+esc(url)+'"><span class="hint">Images hosted on other sites may be blocked by the platform. Uploading is more reliable.</span></div>'+
  '<p class="msg err" id="formMsg" role="alert"></p><div class="admin-actions"><button class="btn" type="submit" id="saveBtn">'+(p?'Save and publish':'Add and publish')+'</button>'+(p?'<button class="btn ghost" type="button" data-act="cancel">Cancel</button>':'')+'</div>';
  prevImg();
}
function prevImg(){
  var el=$('#prev'); if(!el) return;
  el.innerHTML=cover({title:($('#f-title')||{}).value||'Product',category:($('#f-cat')||{}).value||'',image:S.image},true);
}
function resizeImage(file){
  return new Promise(function(res,rej){
    if(!/^image\/(png|jpeg|webp)$/.test(file.type)) return rej(new Error('type'));
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('decode'))};
      im.onload=function(){
        var max=720, k=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- saving ---------- */
var artifactNs;
async function getArtifact(){
  if(artifactNs!==undefined) return artifactNs;
  try{ artifactNs=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null; }catch(e){ artifactNs=null; }
  return artifactNs;
}
function buildDoc(list){
  var json=JSON.stringify({v:2,products:list}).replace(/</g,'\\u003c');
  var close='</scr'+'ipt>';
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    document.querySelector('title').outerHTML+document.querySelector('meta[name="claude:viewport-fit-sides"]').outerHTML+
    document.getElementById('app-font').outerHTML+document.getElementById('app-style').outerHTML+
    '<div id="root"></div><script type="application/json" id="seed">'+json+close+'<script id="main">'+document.getElementById('main').textContent+close+'</body></html>';
}
async function publishProducts(list){
  var a=await getArtifact();
  if(!a) throw {code:'unavailable'};
  var json=JSON.stringify({v:2,products:list});
  try{
    await a.publish({'products.json':{content:json,contentType:'application/json'}});
  }catch(e){
    if(e&&(e.code==='capability_disabled'||e.code==='capability_removed'||e.code==='read_only_path')){ await a.publish(buildDoc(list)); }
    else throw e;
  }
}
function errText(e){
  var c=e&&e.code;
  if(c==='unavailable'||c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared') return 'This account cannot save changes. Open the page signed in as the store owner, then use the admin panel.';
  if(c==='conflict') return 'A newer version was just published. The page will reload; repeat your change after it does.';
  if(c==='rate_limited') return 'Too many publishes in a row. Wait a moment and try again.';
  if(c==='too_large') return 'The data is too large. Use smaller images.';
  return 'Publishing failed. Try again in a moment.';
}
async function persist(next,okText){
  if(S.busy) return false;
  S.busy=true; adminMsg('Publishing…');
  var sb=$('#saveBtn'); if(sb) sb.disabled=true;
  try{ await publishProducts(next); S.products=next; adminMsg(okText); return true; }
  catch(e){ adminMsg(errText(e),true); return false; }
  finally{ S.busy=false; var b=$('#saveBtn'); if(b) b.disabled=false; }
}
async function submitForm(){
  var fm=$('#formMsg'); fm.textContent='';
  var title=$('#f-title').value.trim(), desc=$('#f-desc').value.trim(), cat=$('#f-cat').value.trim();
  var rate=$('#f-rating').value===''?0:Number($('#f-rating').value);
  if(!title){fm.textContent='Enter the product title.';$('#f-title').focus();return}
  if(!cat){fm.textContent='Enter a category.';$('#f-cat').focus();return}
  if(!isFinite(rate)||rate<0||rate>5){fm.textContent='Rating must be between 0 and 5.';$('#f-rating').focus();return}
  var urlv=$('#f-url').value.trim();
  if(urlv&&!cleanImg(urlv)){fm.textContent='The image URL must start with https://';$('#f-url').focus();return}
  var item={id:S.editId||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),title:title,desc:desc,category:cat,image:S.image||'',rating:Math.round(rate*10)/10};
  var next=S.editId?S.products.map(function(p){return p.id===S.editId?item:p}):S.products.concat([item]);
  var ok=await persist(next,S.editId?'Saved. The change is live in the store.':'Product added. It is live in the store.');
  if(ok){ S.editId=null; adminList(); adminForm(); }
}

/* ---------- routing + events ---------- */
function showView(){
  var h=location.hash.replace('#','');
  S.route=(h==='admin')?'admin':'store';
  if(S.route==='store') buildStore();
  else if(S.unlocked) buildAdmin();
  else buildLogin();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',showView);

root.addEventListener('click',function(e){
  touch();
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act');
  if(act==='home'){ e.preventDefault(); if(location.hash) history.replaceState(null,'',location.pathname+location.search); showView(); return; }
  if(act==='admin'){ e.preventDefault(); location.hash='admin'; return; }
  if(act==='browse'){ var c=$('#catalog'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(act==='cat'){ S.cat=t.getAttribute('data-cat')||''; updateStore(); return; }
  if(act==='logout'){ logout(''); return; }
  if(act==='new'){ S.editId=null; adminForm(); $('#f-title').focus(); return; }
  if(act==='cancel'){ S.editId=null; adminForm(); return; }
  if(act==='edit'){ S.editId=t.getAttribute('data-id'); adminForm(); $('#pform').scrollIntoView({behavior:'smooth',block:'start'}); $('#f-title').focus(); return; }
  if(act==='del'){
    var id=t.getAttribute('data-id');
    if(S.delId!==id){ S.delId=id; clearTimeout(S.delTimer); S.delTimer=setTimeout(function(){S.delId=null;adminList()},4000); adminList(); return; }
    clearTimeout(S.delTimer); S.delId=null;
    persist(S.products.filter(function(p){return p.id!==id}),'Product deleted from the store.').then(function(ok){ if(ok&&S.editId===id) S.editId=null; adminList(); adminForm(); });
    return;
  }
});
root.addEventListener('input',function(e){
  touch();
  if(e.target.id==='q'){ S.q=e.target.value; updateStore(); }
  else if(e.target.id==='f-url'){ S.image=cleanImg(e.target.value.trim()); prevImg(); }
  else if(e.target.id==='f-title'||e.target.id==='f-cat'){ prevImg(); }
});
root.addEventListener('change',async function(e){
  if(e.target.id!=='f-file'||!e.target.files[0]) return;
  var fm=$('#formMsg'); fm.textContent='';
  try{ S.image=await resizeImage(e.target.files[0]); $('#f-url').value=''; prevImg(); }
  catch(x){ fm.textContent='Could not read that image. Use a PNG, JPG or WEBP file.'; e.target.value=''; }
});
root.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='loginForm') doLogin();
  else if(e.target.id==='pform') submitForm();
});
root.addEventListener('error',function(e){
  var im=e.target; if(im&&im.tagName==='IMG'&&im.getAttribute('data-cover')){
    var box=im.parentNode, small=box.classList.contains('sm');
    var host=box.closest('.card,.pitem'), cat='';
    if(host){ var b=host.querySelector('.badge'); if(b) cat=b.textContent; else { var s=host.querySelector('.info span'); if(s) cat=s.textContent; } }
    var tmp=document.createElement('div'); tmp.innerHTML=genCover({title:im.alt,category:cat},small);
    box.replaceWith(tmp.firstChild); fitCovers();
  }
},true);
/* pointer-follow glow on cards */
var raf=0;
root.addEventListener('pointermove',function(e){
  var c=e.target.closest&&e.target.closest('.card'); if(!c||raf) return;
  raf=requestAnimationFrame(function(){ raf=0; var r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px'); });
});

/* ---------- load ---------- */
async function load(){
  var seed=[]; try{ var s=JSON.parse($('#seed').textContent); if(validList(s.products)) seed=s.products; }catch(e){}
  var list=seed;
  if(location.protocol!=='file:') try{
    var ctl=new AbortController(), tm=setTimeout(function(){ctl.abort()},3000);
    var r=await fetch(new URL('products.json',location.href).href,{cache:'no-store',signal:ctl.signal});
    clearTimeout(tm);
    if(r.ok){ var d=await r.json(); if(d&&d.v>=2&&validList(d.products)) list=d.products; }
  }catch(e){}
  S.products=list; S.loaded=true;
  if(S.route==='store') updateStore(); else if(S.route==='admin'&&S.unlocked){ adminList(); adminForm(); }
}
shell(); showView(); load();
})();
</script>
